upstream backend_pool {
    server 10.7.9.129:3001;
    server 10.7.16.21:3002;
}

server {
    listen 80;
    server_name app.tcp-titans.test api.tcp-titans.test;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.tcp-titans.test api.tcp-titans.test;

    # Configure these paths according to the machine where
    # the TLS certificate is installed.
    ssl_certificate /path/to/app.tcp-titans.test+1.pem;
    ssl_certificate_key /path/to/app.tcp-titans.test+1-key.pem;

    location / {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
